# cargo-about configuration: the third-party licence notice shipped with
# every release binary (THIRD-PARTY-LICENSES.html).
#
#   cargo fetch --locked
#   cargo about generate --frozen --fail -c about.toml -m crates/promochaos-cli/Cargo.toml -o THIRD-PARTY-LICENSES.html about.hbs
#
# Run it from the workspace root after any Cargo.lock change. dist copies the
# file into every release archive (`include` in dist-workspace.toml), and the
# CI job "third-party licences" fails when the committed file is out of date.

# Only the licences that deny.toml allows. Keep the two lists the same: a
# licence missing here makes `cargo about generate` fail, so a copyleft
# dependency can never reach a release notice unnoticed.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]

# The release targets in dist-workspace.toml, so platform-only crates
# (windows-sys, libc and the like) are listed exactly once for each binary.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

# Test-only crates are not in the binary. Build scripts and proc macros are
# listed: their code runs at build time, and some of it (proc macros) ends up
# in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Workspace crates are promochaos itself (Apache-2.0, see LICENSE and NOTICE).
private = { ignore = true }

# Run with --frozen (--locked and --offline): licences then come only from
# each crate's own files, so the notice is the same on every machine.

# function-runner v9.2.3 (git dependency) has no `license` field. Its
# repository ships the Apache License 2.0 in LICENSE.md. The checksum is the
# SHA-256 of that file at tag v9.2.3 (checked 2026-11-15); a bump that changes
# the file makes cargo-about fail until it is checked again, as deny.toml's
# clarification does.
[function-runner.clarify]
license = "Apache-2.0"

[[function-runner.clarify.files]]
path = "LICENSE.md"
license = "Apache-2.0"
checksum = "eede5d33ee7219f4dd25877224c3a9c45f941ae042b6f9b92f7a362d2d297476"
