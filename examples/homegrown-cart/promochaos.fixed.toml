# promochaos settings for the homegrown cart engine, fixed build.
# The same as promochaos.toml, with --fixed on every command. This run must
# report zero problems.
#
#   cargo build -p homegrown-cart
#   promochaos run --settings promochaos.fixed.toml

[target]
kind = "command"
run = ["../../target/debug/homegrown_cart", "--fixed"]
reset = ["../../target/debug/homegrown_cart", "--fixed", "--reset"]
timeout_ms = 2000
tax_inclusive = false
shipping_discount_in = "discounts"

[store]
currency = "USD"
catalog = "catalog.toml"
codes = ["WELCOME20"]

[rules]
max_discount_percent = "30"
never_discount = { gift_cards = true, tags = ["gift-card"] }
min_subtotal = { amount = "100.00", kinds = ["shipping"], basis = "after_discounts" }
usage_limit = { WELCOME20 = 3 }
idempotent_retry = true
deterministic_sample = 50

[generate]
seed = 42
carts = 300
max_lines = 250
currencies = ["USD"]
