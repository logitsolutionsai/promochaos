# promochaos settings for the bundle discount example, default (buggy) build.
# Build with `shopify app function build` (see README.md), then from this folder:
#   promochaos run --settings promochaos.toml
# For the fixed build, set wasm = "dist/function-fixed.wasm".
# codes_accepted is a built-in rule: only the codes below may be accepted.

[target]
kind = "shopify-function"
extension = "."
run = "cart.lines.discounts.generate.run"
discount_classes = ["PRODUCT"]
wasm = "dist/function.wasm"
runner = "in-process"
timeout_ms = 10000

[store]
currency = "USD"
catalog = "catalog.toml"
codes = ["BUNDLE10"]

[rules]
max_discount_percent = "60"
never_discount = { gift_cards = true, tags = ["gift-card"] }
metamorphic = ["split_line", "reorder_lines", "add_ineligible_line"]
deterministic_sample = 50

[generate]
seed = 42
carts = 500
max_lines = 250
currencies = ["USD"]
twins = 60
