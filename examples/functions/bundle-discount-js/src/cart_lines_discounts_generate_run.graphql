query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            isGiftCard
            bundle: hasAnyTag(tags: ["bundle"])
          }
        }
      }
    }
  }
  enteredDiscountCodes {
    code
    rejectable
  }
  discount {
    discountClasses
  }
}
