query Input {
  presentmentCurrencyRate
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            isGiftCard
            multiBuy: hasAnyTag(tags: ["multi-buy"])
          }
        }
        ... on CustomProduct {
          isGiftCard
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") {
      jsonValue
    }
  }
}
