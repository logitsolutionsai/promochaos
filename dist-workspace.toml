# Release configuration for dist (cargo-dist) 0.34.
# Regenerate the CI workflow with `dist init` / `dist generate` after editing.
#
# crates.io publishing is off: promochaos depends on function-runner as a git
# dependency, and crates.io refuses crates with git dependencies. Users run the
# binary (release archives, npm, Homebrew), not the crate. Every crate except
# the CLI package (promochaos, in crates/promochaos-cli) sets `publish = false` and
# `[package.metadata.dist] dist = false`; the CLI opts back in with `dist = true`.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell", "npm", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# npm: `npx promochaos`, unscoped package name.
npm-package = "promochaos"
# Homebrew: `brew install logitsolutionsai/tap/promochaos`.
tap = "logitsolutionsai/homebrew-tap"
formula = "promochaos"
publish-jobs = ["homebrew", "npm"]
install-path = "CARGO_HOME"
install-updater = false
pr-run-mode = "plan"
# Copied into the root of every release archive, next to the LICENSE, README and
# CHANGELOG that dist includes on its own. The file is generated by cargo-about
# (about.toml, about.hbs) and committed; the CI job "third-party licences" fails
# when it is out of date with Cargo.lock.
include = ["THIRD-PARTY-LICENSES.html"]
