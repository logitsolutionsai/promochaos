name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The same toolchain as rust-toolchain.toml (function-runner v9.2.3 pins 1.95.0).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the homegrown engine
        run: cargo build -p homegrown-cart

      # CI tests the logic only. The Shopify example Functions are built and run
      # locally before each release (README, "Running the Shopify Examples"):
      # they need schema.graphql, which is not committed (Shopify publishes it
      # without a stated licence) and which only `shopify app function schema`
      # can fetch, after a Shopify login that CI does not have. Their tests in
      # crates/promochaos-cli/tests/examples.rs, the runner-parity test
      # included, print SKIPPED and pass.
      - name: Shopify examples (local only)
        shell: bash
        run: |
          echo "::notice title=Shopify examples skipped::The example Functions need schema.graphql, which needs a Shopify login to fetch. CI has no login, so they are built and run locally before each release (see README, Running the Shopify Examples). Their tests skip in this run."

      - name: Test
        run: cargo test --workspace

      - name: Integration, seeded bugs must be found (exit 1)
        shell: bash
        run: |
          set +e
          cargo run -p promochaos -- run --settings examples/homegrown-cart/promochaos.toml --out promochaos-results/homegrown
          code=$?
          set -e
          echo "promochaos exited with $code"
          if [ "$code" -ne 1 ]; then
            echo "Expected exit 1 (problems found) for the seeded-bug build, got $code"
            exit 1
          fi

      - name: Integration, fixed build must be clean (exit 0)
        shell: bash
        run: |
          set +e
          cargo run -p promochaos -- run --settings examples/homegrown-cart/promochaos.fixed.toml --out promochaos-results/homegrown-fixed
          code=$?
          set -e
          echo "promochaos exited with $code"
          if [ "$code" -ne 0 ]; then
            echo "Expected exit 0 (no problems) for the fixed build, got $code"
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promochaos-results-${{ matrix.os }}
          path: promochaos-results/
          if-no-files-found: ignore

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run cargo-deny natively on the pinned toolchain, so `cargo metadata` sees
      # the same graph as a local run (the git dependency on function-runner and
      # rust-toolchain.toml included). 0.20.2 is the version checked locally.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny check

  # THIRD-PARTY-LICENSES.html ships in every release archive (dist
  # `include`). It is generated by cargo-about from Cargo.lock with about.toml,
  # which accepts only the licences deny.toml allows. This job fails when the
  # committed file is out of date, or when a dependency's licence is not on the list.
  licences:
    name: third-party licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Generate the notice
        run: |
          cargo fetch --locked
          cargo about generate --frozen --fail -c about.toml -m crates/promochaos-cli/Cargo.toml -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html" about.hbs

      - name: The committed notice is up to date
        run: |
          if ! diff -q --strip-trailing-cr THIRD-PARTY-LICENSES.html "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html"; then
            echo "THIRD-PARTY-LICENSES.html is out of date. Regenerate it with the command at the top of about.toml and commit it."
            exit 1
          fi
